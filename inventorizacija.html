<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventorizacija · PERLIPROF</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f7; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
  .card { background: #fff; border-radius: 20px; padding: 3rem 2.5rem; text-align: center; max-width: 400px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
  .emoji { font-size: 56px; margin-bottom: 1rem; }
  h1 { font-size: 26px; font-weight: 800; color: #1c3d5a; margin-bottom: 0.5rem; }
  .badge { display: inline-block; background: #f0f4ff; color: #1A4F80; font-size: 13px; font-weight: 700; padding: 6px 16px; border-radius: 30px; margin-bottom: 1.5rem; letter-spacing: 0.5px; }
  p { font-size: 15px; color: #6e6e73; line-height: 1.6; margin-bottom: 2rem; }
  a { display: inline-block; color: #1A4F80; font-size: 14px; font-weight: 600; text-decoration: none; background: #f0f4ff; padding: 10px 22px; border-radius: 12px; }
  a:hover { background: #dce8f5; }
</style>
</head>
<body>
<div class="card">
  <div class="emoji">🔧</div>
  <h1>Inventorizacija</h1>
  <div class="badge">⏳ Info ruošiama</div>
  <p>Įrankių ir atsarginių dalių apskaita.<br>Puslapis bus parengtas artimiausiu metu.</p>
  <a href="https://perliprof.github.io/">← Grįžti į hubą</a>
</div>
</body>
</html>
