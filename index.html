<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="300">
<title>Pamainos lenktynės</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: #f2f2f7;
  color: #1c1c1e;
  padding: 1.25rem 1.5rem;
  min-height: 100vh;
}
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 1.25rem;
  gap: 1rem;
}
.page-title-sub { font-size: 15px; color: #6e6e73; margin-bottom: 4px; font-weight: 600; }
.page-title { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; }
.page-meta { font-size: 15px; color: #6e6e73; margin-top: 5px; }
.month-box {
  background: white;
  border-radius: 12px;
  padding: 10px 18px;
  text-align: right;
  white-space: nowrap;
  flex-shrink: 0;
}
.month-num { font-size: 26px; font-weight: 800; }
.month-label { font-size: 13px; color: #6e6e73; margin-top: 2px; }
.main-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.25rem;
}
@media (max-width: 900px) {
  .main-grid { grid-template-columns: 1fr; }
}
.section {
  background: white;
  border-radius: 16px;
  padding: 1.25rem;
}
.section-title {
  font-size: 17px;
  font-weight: 700;
  color: #3c3c43;
  margin-bottom: 1rem;
  padding-bottom: 0.75rem;
  border-bottom: 0.5px solid #e5e5ea;
}
.mv-nav { background: #f2f2f7; border: none; border-radius: 8px; width: 34px; height: 34px; font-size: 20px; font-weight: 700; cursor: pointer; color: #3c3c43; line-height: 1; }
.mv-nav:hover { background: #e5e5ea; }
.mv-sel { font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 800; color: #0A2342; background: #f2f2f7; border: 1px solid #e5e5ea; border-radius: 8px; padding: 6px 10px; cursor: pointer; outline: none; }
.rank-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  margin-bottom: 1rem;
}
@media (max-width: 900px) {
  .rank-grid { grid-template-columns: repeat(2, 1fr); }
}
.rank-card {
  background: #f2f2f7;
  border-radius: 10px;
  padding: 0.75rem;
  border-top: 3px solid;
}
.rank-card[data-rank="1"] { border-color: #F5A623; }
.rank-card[data-rank="2"] { border-color: #AEADB3; }
.rank-card[data-rank="3"] { border-color: #E07055; }
.rank-card[data-rank="4"] { border-color: #5B9BD5; }
.rank-card[data-onplan="true"]  { background: #e6f4ec; border-color: #1A7A4A; }
.rank-card[data-onplan="false"] { background: #fce9e7; border-color: #C0392B; }
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.rank-badge {
  font-size: 12px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 20px;
  display: inline-block;
  font-family: 'Montserrat', sans-serif;
}
.rank-badge[data-rank="1"] { background: #FEF3DA; color: #7A4A00; }
.rank-badge[data-rank="2"] { background: #EFEFEF; color: #555; }
.rank-badge[data-rank="3"] { background: #FBE8E4; color: #7A2010; }
.rank-badge[data-rank="4"] { background: #E3EEF8; color: #1A4F80; }
.card-medal { font-size: 30px; line-height: 1; }
.card-name { font-size: 17px; font-weight: 700; margin: 7px 0 2px; }
.card-total {
  font-size: 44px;
  font-weight: 900;
  line-height: 1;
  color: #1c1c1e;
  letter-spacing: -1.5px;
}
.card-total[data-rank="1"] { color: #C47A00; }
.card-unit { font-size: 12px; color: #8e8e93; margin-bottom: 8px; }
.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: #8e8e93;
  background: white;
  border-radius: 6px;
  padding: 4px 7px;
  margin-top: 4px;
}
.stat-val { font-weight: 700; font-size: 13px; color: #1c1c1e; }
.stat-val.good { color: #1A7A4A; }
.stat-val.bad  { color: #C0392B; }
.stat-val.gold { color: #C47A00; }
.chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 6px;
  font-size: 13px;
  color: #8e8e93;
  align-items: center;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  display: inline-block;
  margin-right: 3px;
  vertical-align: middle;
}
.chart-wrap { position: relative; height: 240px; }
.records-banner {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.25rem;
  margin-bottom: 1.25rem;
}
@media (max-width: 900px) { .records-banner { grid-template-columns: 1fr; } }
.record-card {
  background: white;
  border-radius: 16px;
  padding: 1rem 1.4rem;
  display: flex;
  align-items: center;
  gap: 1.1rem;
  border-left: 6px solid;
}
.record-card.rec-max { border-color: #C47A00; }
.record-card.rec-eco { border-color: #1A7A4A; }
.record-icon { font-size: 46px; line-height: 1; flex-shrink: 0; }
.record-body { flex: 1; min-width: 0; }
.record-label { font-size: 13px; font-weight: 700; color: #6e6e73; text-transform: uppercase; letter-spacing: 0.5px; }
.record-value { font-size: 40px; font-weight: 900; letter-spacing: -1.5px; line-height: 1.05; margin: 2px 0; }
.record-card.rec-max .record-value { color: #C47A00; }
.record-card.rec-eco .record-value { color: #1A7A4A; }
.record-meta { font-size: 14px; color: #8e8e93; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.record-shift-badge { display: inline-block; font-weight: 700; padding: 2px 10px; border-radius: 20px; font-size: 13px; color: #fff; }
.status-bar {
  text-align: center;
  font-size: 13px;
  color: #c7c7cc;
  margin-top: 1rem;
  padding-bottom: 0.5rem;
}
.status-bar.error { color: #C0392B; }
#loading-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(242,242,247,0.85);
  align-items: center;
  justify-content: center;
  font-size: 17px;
  font-weight: 700;
  color: #6e6e73;
  z-index: 99;
}
#loading-overlay.visible { display: flex; }
</style>
</head>
<body>

<div id="loading-overlay">Kraunami duomenys…</div>

<div class="page-header">
  <div>
    <p class="page-title-sub">Pustas perlitas</p>
    <h1 class="page-title">Pamainos lenktynės</h1>
    <p class="page-meta">Tikslas: <strong>120 m³</strong> / pamaina &nbsp;·&nbsp; Aukso zona: <strong>135+ m³</strong></p>
  </div>
  <div class="month-box">
    <div class="month-num" id="month-display"></div>
    <div class="month-label" id="day-display"></div>
  </div>
</div>

<div class="records-banner" id="records-banner"></div>

<div class="section">
  <div class="section-title" style="display:flex;align-items:center;gap:0.55rem;flex-wrap:wrap">
    <button class="mv-nav" onclick="navMonth(-1)">‹</button>
    <select id="m-month-sel" class="mv-sel" onchange="onMonthSel()">
      <option value="0">Sausis</option><option value="1">Vasaris</option>
      <option value="2">Kovas</option><option value="3">Balandis</option>
      <option value="4">Gegužė</option><option value="5">Birželis</option>
      <option value="6">Liepa</option><option value="7">Rugpjūtis</option>
      <option value="8">Rugsėjis</option><option value="9">Spalis</option>
      <option value="10">Lapkritis</option><option value="11">Gruodis</option>
    </select>
    <select id="m-year-sel" class="mv-sel" onchange="onMonthSel()"></select>
    <button class="mv-nav" onclick="navMonth(1)">›</button>
    <span style="color:#8e8e93;font-weight:500;font-size:15px">— mėnesinis vaizdas</span>
  </div>
  <div class="rank-grid" id="monthly-cards"></div>
  <div class="chart-legend" id="monthly-legend"></div>
  <div class="chart-wrap" style="height:260px"><canvas id="monthly-chart"></canvas></div>
</div>

<div class="section yearly-section" style="margin-top:1.25rem;">
  <h2 class="section-title" id="yearly-title">Metinis vaizdas</h2>
  <div class="rank-grid" id="yearly-cards"></div>
  <div class="chart-legend" id="yearly-legend"></div>
  <div class="chart-wrap" style="height:260px;"><canvas id="yearly-chart"></canvas></div>
</div>

<p class="status-bar" id="status-bar"></p>

<script>
const CONFIG = {
  target_m3: 120,
  gold_m3: 135,
  cycle_days: 8,
  shifts_per_day: 2,
};

const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRGeNdfu4A-DOF4jONXpTCKaSkE1uUpLXa94HHkNPw1mhIoWHNcKwhvoSL22Nh48DEV2DDMZ1KXprI/pub?output=csv';

const MONTH_NAMES = [
  'Sausis','Vasaris','Kovas','Balandis','Gegužė','Birželis',
  'Liepa','Rugpjūtis','Rugsėjis','Spalis','Lapkritis','Gruodis'
];
const MONTH_SHORT = [
  'Sau.','Vas.','Kov.','Bal.','Geg.','Bir.',
  'Lie.','Rug.','Rgs.','Spa.','Lap.','Gru.'
];

const SHIFT_COLORS = [
  { bg: 'rgba(245,166,35,0.85)',  border: '#C47A00' },
  { bg: 'rgba(80,170,130,0.85)',  border: '#1E7A50' },
  { bg: 'rgba(224,112,85,0.85)',  border: '#B84020' },
  { bg: 'rgba(91,155,213,0.85)',  border: '#2A6FAD' },
];

// Escape sheet-supplied strings before they reach innerHTML. Most rendered
// values here are numeric, but the CSV `date` field is unvalidated and its raw
// year segment flows into innerHTML via fmtDate — a crafted date in the sheet
// would otherwise inject markup onto the factory board and the public page.
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function toDateStr(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function filterRange(data, from, to) {
  return data.filter(d => d.date >= from && d.date <= to);
}

// Quote-aware CSV parser — handles quoted fields containing commas, escaped
// quotes ("") and embedded newlines. A naive split(',') silently shifts every
// column after a comma-bearing cell, producing plausible-but-wrong KPIs.
function parseCSV(text) {
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else {
      if (c === '"') q = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function buildStats(periodData, allData) {
  const raw = [1, 2, 3, 4].map(s => {
    const rows = periodData.filter(d => d.shift === s);
    const tot  = rows.reduce((a, b) => a + b.m3, 0);
    const gas  = rows.reduce((a, b) => a + b.gas, 0);
    const cnt  = rows.length;
    const avg  = cnt ? +(tot / cnt).toFixed(1) : 0;
    const gasEff = gas ? +(tot / gas * 100).toFixed(1) : 0;

    const allRows = allData
      .filter(d => d.shift === s)
      .sort((a, b) => b.date.localeCompare(a.date));
    let streak = 0;
    for (const r of allRows) {
      if (r.m3 >= CONFIG.target_m3) streak++;
      else break;
    }
    const waste = +rows.reduce((a, b) => a + b.waste, 0).toFixed(1);
    return { shift: s, name: s + ' pamaina', tot, cnt, avg, gasEff, streak, waste };
  });

  raw.sort((a, b) => b.tot - a.tot);
  raw.forEach((r, i) => {
    r.rank = i + 1;
    r.gapToNext = i > 0 ? raw[i - 1].tot - r.tot : 0;
  });
  return raw;
}

function renderCards(stats, containerId) {
  document.getElementById(containerId).innerHTML = stats.map(s => {
    const onPlan      = s.avg >= CONFIG.target_m3;
    const avgClass    = onPlan ? 'good' : 'bad';
    const streakClass = s.streak >= 5 ? 'gold' : (s.streak >= 3 ? 'good' : '');
    const medalHtml   = s.rank === 1 ? '<span class="card-medal">🥇</span>' : '';
    const gapRow = s.rank > 1
      ? `<div class="stat-row"><span>Trūksta iki ${s.rank - 1} v.</span><span class="stat-val bad">−${s.gapToNext} m³</span></div>`
      : '';
    return `
      <div class="rank-card" data-rank="${s.rank}" data-onplan="${onPlan}">
        <div class="card-top">
          <span class="rank-badge" data-rank="${s.rank}">${s.rank} vieta</span>
          ${medalHtml}
        </div>
        <p class="card-name">${s.name}</p>
        <p class="card-total" data-rank="${s.rank}">${s.tot.toLocaleString('lt-LT')}</p>
        <p class="card-unit">m³ šiuo laikotarpiu</p>
        <div class="stat-row">
          <span>Vid. / pamainai</span>
          <span class="stat-val ${avgClass}">${s.avg} m³</span>
        </div>
        <div class="stat-row">
          <span>Dujų efekt.</span>
          <span class="stat-val">${s.gasEff} m³/100m³</span>
        </div>
        <div class="stat-row">
          <span>Atliekos</span>
          <span class="stat-val">${s.waste} m³</span>
        </div>
        ${gapRow}
        <div class="stat-row">
          <span>Serija</span>
          <span class="stat-val ${streakClass}">${s.streak} pam.</span>
        </div>
      </div>`;
  }).join('');
}

function renderShiftBarsChart(periodData, canvasId, legendId, showFuture) {
  const now = new Date();
  const sorted = [...periodData].sort((a, b) =>
    a.date.localeCompare(b.date) || a.shift - b.shift
  );

  const labels = [], values = [], bgColors = [], bdColors = [];

  sorted.forEach(e => {
    const dt = new Date(e.date + 'T12:00:00');
    const dd = String(dt.getDate()).padStart(2, '0');
    const mm = String(dt.getMonth() + 1).padStart(2, '0');
    labels.push([dd + '.' + mm, 'P' + e.shift + (e.type ? ' ' + e.type : '')]);
    values.push(e.m3);
    bgColors.push(SHIFT_COLORS[e.shift - 1].bg);
    bdColors.push(SHIFT_COLORS[e.shift - 1].border);
  });

  if (showFuture) {
    const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    for (let d = now.getDate() + 1; d <= daysInMonth; d++) {
      const dd = String(d).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      for (let s = 0; s < CONFIG.shifts_per_day; s++) {
        labels.push([dd + '.' + mm, s === 0 ? 'D' : 'N']);
        values.push(null);
        bgColors.push('transparent');
        bdColors.push('transparent');
      }
    }
  }

  document.getElementById(legendId).innerHTML =
    [1, 2, 3, 4].map((s, i) =>
      `<span><span class="legend-dot" style="background:${SHIFT_COLORS[i].bg}"></span>${s} pam.</span>`
    ).join('') +
    `<span style="margin-left:6px;padding-left:8px;border-left:1px solid #e5e5ea;display:flex;align-items:center;gap:4px">` +
    `<span style="width:18px;border-top:2px dashed #E24B4A;display:inline-block"></span>Tikslas</span>`;

  const _cv = document.getElementById(canvasId);
  const _ex = Chart.getChart(_cv); if (_ex) _ex.destroy();
  new Chart(_cv, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          data: values,
          backgroundColor: bgColors,
          borderColor: bdColors,
          borderWidth: 1,
          borderRadius: 3,
        },
        {
          data: Array(labels.length).fill(CONFIG.target_m3),
          type: 'line',
          borderColor: '#E24B4A',
          borderDash: [6, 3],
          borderWidth: 3,
          pointRadius: 0,
          fill: false,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: {
          ticks: {
            font: { size: 9, family: "'Montserrat', sans-serif" },
            autoSkip: false,
            maxRotation: 90,
            minRotation: 90,
          },
          grid: { display: false },
        },
        y: {
          min: 0,
          suggestedMax: 150,
          ticks: { font: { size: 11, family: "'Montserrat', sans-serif" } },
          grid: { color: 'rgba(0,0,0,0.04)' },
        }
      }
    }
  });
}

function renderYearlyChart(data, canvasId, legendId) {
  const months = [...new Set(data.map(d => d.date.substring(0, 7)))].sort();
  const labels  = months.map(m => MONTH_SHORT[parseInt(m.split('-')[1]) - 1]);

  const datasets = [1, 2, 3, 4].map(s => ({
    label: s + ' pamaina',
    data: months.map(month => {
      const rows = data.filter(d => d.shift === s && d.date.startsWith(month));
      return +rows.reduce((a, b) => a + b.m3, 0).toFixed(1);
    }),
    backgroundColor: SHIFT_COLORS[s - 1].bg,
    borderColor: SHIFT_COLORS[s - 1].border,
    borderWidth: 1,
  }));

  document.getElementById(legendId).innerHTML =
    [1, 2, 3, 4].map((s, i) =>
      `<span><span class="legend-dot" style="background:${SHIFT_COLORS[i].bg}"></span>${s} pam.</span>`
    ).join('');

  const _yc = document.getElementById(canvasId);
  const _yex = Chart.getChart(_yc); if (_yex) _yex.destroy();
  new Chart(_yc, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: {
          stacked: true,
          ticks: { font: { size: 12, family: "'Montserrat', sans-serif" } },
          grid: { display: false },
        },
        y: {
          stacked: true,
          min: 0,
          ticks: { font: { size: 11, family: "'Montserrat', sans-serif" } },
          grid: { color: 'rgba(0,0,0,0.04)' },
        }
      }
    }
  });
}

/* ── Rekordai (per visą laikotarpį) ── */
function computeRecords(data) {
  // Sujungti pagal data+pamaina (per visus tipus)
  const byShiftDay = {};
  data.forEach(d => {
    const key = d.date + '|' + d.shift;
    if (!byShiftDay[key]) byShiftDay[key] = { date: d.date, shift: d.shift, m3: 0, gas: 0 };
    byShiftDay[key].m3  += d.m3;
    byShiftDay[key].gas += d.gas;
  });
  const arr = Object.values(byShiftDay);

  // Daugiausiai m³ per vieną pamainą
  let maxRec = null;
  arr.forEach(r => { if (!maxRec || r.m3 > maxRec.m3) maxRec = r; });

  // Ekonomiškiausia: didžiausias m³/dujos (tik pilnesnės pamainos, gas>0)
  let ecoRec = null;
  arr.forEach(r => {
    if (r.gas > 0 && r.m3 >= 60) {
      const eff = +(r.m3 / r.gas * 100).toFixed(1);
      if (!ecoRec || eff > ecoRec.eff) ecoRec = { ...r, eff };
    }
  });

  return { maxRec, ecoRec };
}

function renderRecords(data) {
  const { maxRec, ecoRec } = computeRecords(data);
  const fmtDate = ds => {
    const p = String(ds).split('-');
    return (+p[2]) + ' ' + (MONTH_SHORT[(+p[1]) - 1] || '') + ' ' + escapeHtml(p[0]);
  };
  const shiftBadge = s => {
    const c = SHIFT_COLORS[s - 1] || SHIFT_COLORS[0];
    return `<span class="record-shift-badge" style="background:${c.border}">${s} pamaina</span>`;
  };

  let html = '';
  if (maxRec) {
    html += `<div class="record-card rec-max">
      <div class="record-icon">🏆</div>
      <div class="record-body">
        <div class="record-label">Daugiausiai per pamainą</div>
        <div class="record-value">${maxRec.m3.toLocaleString('lt-LT')} m³</div>
        <div class="record-meta">${shiftBadge(maxRec.shift)} · ${fmtDate(maxRec.date)}</div>
      </div>
    </div>`;
  }
  if (ecoRec) {
    html += `<div class="record-card rec-eco">
      <div class="record-icon">💚</div>
      <div class="record-body">
        <div class="record-label">Ekonomiškiausia pamaina</div>
        <div class="record-value">${ecoRec.eff} <span style="font-size:20px">m³/100m³</span></div>
        <div class="record-meta">${shiftBadge(ecoRec.shift)} · ${fmtDate(ecoRec.date)} · ${ecoRec.m3.toLocaleString('lt-LT')} m³</div>
      </div>
    </div>`;
  }
  document.getElementById('records-banner').innerHTML = html;
}

let PROD_DATA = [];
let selYear, selMonth;

function renderMonthlyView() {
  const now = new Date();
  const isCurrent = (selYear === now.getFullYear() && selMonth === now.getMonth());
  const monthStart = toDateStr(new Date(selYear, selMonth, 1));
  const lastDay    = new Date(selYear, selMonth + 1, 0);
  const monthEnd   = isCurrent ? toDateStr(now) : toDateStr(lastDay);

  const monthlyData  = filterRange(PROD_DATA, monthStart, monthEnd);
  const monthlyStats = buildStats(monthlyData, PROD_DATA);

  document.getElementById('m-month-sel').value = selMonth;
  document.getElementById('m-year-sel').value  = selYear;
  renderCards(monthlyStats, 'monthly-cards');
  renderShiftBarsChart(monthlyData, 'monthly-chart', 'monthly-legend', isCurrent);
}

function navMonth(dir) {
  selMonth += dir;
  if (selMonth < 0)  { selMonth = 11; selYear--; }
  if (selMonth > 11) { selMonth = 0;  selYear++; }
  const ySel = document.getElementById('m-year-sel');
  if (![...ySel.options].some(o => parseInt(o.value) === selYear)) {
    const opt = document.createElement('option'); opt.value = selYear; opt.textContent = selYear; ySel.appendChild(opt);
    [...ySel.options].sort((a,b)=>b.value-a.value).forEach(o=>ySel.appendChild(o));
  }
  renderMonthlyView();
}

function onMonthSel() {
  selMonth = parseInt(document.getElementById('m-month-sel').value);
  selYear  = parseInt(document.getElementById('m-year-sel').value);
  renderMonthlyView();
}

function init(data) {
  const now      = new Date();
  const todayStr = toDateStr(now);
  PROD_DATA = data;

  renderRecords(data);
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();

  document.getElementById('month-display').textContent = now.getDate() + ' / ' + daysInMonth;
  document.getElementById('day-display').textContent   = MONTH_NAMES[now.getMonth()] + ' ' + now.getFullYear();

  // Mėnesinis vaizdas — su mėnesio pasirinkimu
  const years = [...new Set(data.map(d => (d.date || '').substring(0, 4)).filter(y => /^\d{4}$/.test(y)))].map(Number);
  const minY = Math.min(...years, now.getFullYear());
  const maxY = Math.max(...years, now.getFullYear());
  const ySel = document.getElementById('m-year-sel');
  ySel.innerHTML = '';
  for (let y = maxY; y >= minY; y--) { const o = document.createElement('option'); o.value = y; o.textContent = y; ySel.appendChild(o); }
  selYear = now.getFullYear(); selMonth = now.getMonth();
  renderMonthlyView();

  // Metinis vaizdas
  const yearStart   = toDateStr(new Date(now.getFullYear(), 0, 1));
  const yearlyData  = filterRange(data, yearStart, todayStr);
  const yearlyStats = buildStats(yearlyData, data);
  document.getElementById('yearly-title').textContent =
    now.getFullYear() + ' m. — metinis vaizdas';
  renderCards(yearlyStats, 'yearly-cards');
  renderYearlyChart(yearlyData, 'yearly-chart', 'yearly-legend');

  document.getElementById('status-bar').textContent =
    'Atnaujinta: ' + now.toLocaleString('lt-LT', { dateStyle: 'short', timeStyle: 'short' }) +
    ' · Puslapis atsinaujina kas 5 min.';
}

async function loadAndRender() {
  document.getElementById('loading-overlay').classList.add('visible');
  try {
    const resp = await fetch(CSV_URL + '&t=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = await resp.text();
    const rows = parseCSV(text).filter(r => r.some(c => c.trim() !== ''));
    const headers = rows[0].map(h => h.trim().toLowerCase());

    const M3_COLS    = ['m3 extra', 'm3 medium', 'm3 premium', 'm3 silos'];
    const WASTE_COLS = ['fines', 'krit'];

    const data = rows.slice(1)
      .map(vals => {
        const o = {};
        headers.forEach((h, i) => { o[h] = (vals[i] || '').trim(); });

        const m3sum = M3_COLS.reduce((s, k) => s + (parseFloat(o[k]) || 0), 0);
        const m3    = m3sum > 0 ? m3sum : (parseFloat(o.m3) || 0);
        const waste = WASTE_COLS.reduce((s, k) => s + (parseFloat(o[k]) || 0), 0);

        return {
          date:  o.date  || '',
          shift: parseInt(o.shift) || 0,
          type:  o.type  || '',
          m3,
          waste,
          gas:   parseFloat(o.gas) || 0,
          kwh:   parseFloat(o.kwh) || 0,
          raw:   parseFloat(o.raw) || 0,
        };
      })
      .filter(d => d.date && d.shift > 0);

    // Jei ta pati data+pamaina+tipas turi kelis įrašus (skirtingi Furn) — susumuoti
    const grouped = {};
    data.forEach(d => {
      const key = d.date + '|' + d.shift + '|' + d.type;
      if (!grouped[key]) {
        grouped[key] = { ...d };
      } else {
        grouped[key].m3    += d.m3;
        grouped[key].waste += d.waste;
        grouped[key].gas   += d.gas;
        grouped[key].kwh   += d.kwh;
        grouped[key].raw   += d.raw;
      }
    });
    const mergedData = Object.values(grouped);

    init(mergedData);
  } catch (e) {
    const bar = document.getElementById('status-bar');
    bar.textContent = 'Klaida kraunant duomenis iš Google Sheets. Puslapis bandys atsinaujinti po 5 min.';
    bar.classList.add('error');
  }
  document.getElementById('loading-overlay').classList.remove('visible');
}

loadAndRender();
</script>
