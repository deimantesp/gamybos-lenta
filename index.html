<script>
const CONFIG = {
  target_m3: 120,
  gold_m3: 135,
  cycle_days: 8,
  shifts_per_day: 2,
};

const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRGeNdfu4A-DOF4jONXpTCKaSkE1uUpLXa94HHkNPw1mhIoWHNcKwhvoSL22Nh48DEV2DDMZ1KXprI/pub?output=csv';

const MONTH_NAMES = [
  'Sausis','Vasaris','Kovas','Balandis','Gegužė','Birželis',
  'Liepa','Rugpjūtis','Rugsėjis','Spalis','Lapkritis','Gruodis'
];
const MONTH_SHORT = [
  'Sau.','Vas.','Kov.','Bal.','Geg.','Bir.',
  'Lie.','Rug.','Rgs.','Spa.','Lap.','Gru.'
];

const SHIFT_COLORS = [
  { bg: 'rgba(245,166,35,0.85)',  border: '#C47A00' },
  { bg: 'rgba(80,170,130,0.85)',  border: '#1E7A50' },
  { bg: 'rgba(224,112,85,0.85)',  border: '#B84020' },
  { bg: 'rgba(91,155,213,0.85)',  border: '#2A6FAD' },
];

// Escape sheet-supplied strings before they reach innerHTML. Most rendered
// values here are numeric, but the CSV `date` field is unvalidated and its raw
// year segment flows into innerHTML via fmtDate — a crafted date in the sheet
// would otherwise inject markup onto the factory board and the public page.
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function toDateStr(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function filterRange(data, from, to) {
  return data.filter(d => d.date >= from && d.date <= to);
}

// Quote-aware CSV parser — handles quoted fields containing commas, escaped
// quotes ("") and embedded newlines. A naive split(',') silently shifts every
// column after a comma-bearing cell, producing plausible-but-wrong KPIs.
function parseCSV(text) {
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else {
      if (c === '"') q = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function buildStats(periodData, allData) {
  const raw = [1, 2, 3, 4].map(s => {
    const rows = periodData.filter(d => d.shift === s);
    const tot  = rows.reduce((a, b) => a + b.m3, 0);
    const gas  = rows.reduce((a, b) => a + b.gas, 0);
    const cnt  = rows.length;
    const avg  = cnt ? +(tot / cnt).toFixed(1) : 0;
    const gasEff = gas ? +(tot / gas * 100).toFixed(1) : 0;

    const allRows = allData
      .filter(d => d.shift === s)
      .sort((a, b) => b.date.localeCompare(a.date));
    let streak = 0;
    for (const r of allRows) {
      if (r.m3 >= CONFIG.target_m3) streak++;
      else break;
    }
    const waste  = +rows.reduce((a, b) => a + b.waste, 0).toFixed(1);
    const rawKg  = +rows.reduce((a, b) => a + b.raw,   0).toFixed(1);
    const rawBrk = {};
    rows.forEach(r => { if (r.rawBrk) Object.entries(r.rawBrk).forEach(([k,v]) => { rawBrk[k] = (rawBrk[k]||0) + v; }); });
    const days = new Set(rows.map(r => r.date)).size;
    return { shift: s, name: s + ' pamaina', tot, cnt, avg, gasEff, streak, waste, rawKg, rawBrk, days };
  });

  raw.sort((a, b) => b.tot - a.tot);
  raw.forEach((r, i) => {
    r.rank = i + 1;
    r.gapToNext = i > 0 ? raw[i - 1].tot - r.tot : 0;
  });
  const byAvg = [...raw].sort((a, b) => b.avg - a.avg);
  byAvg.forEach((r, i) => { r.avgRank = i + 1; });
  return raw;
}

function renderCards(stats, containerId) {
  document.getElementById(containerId).innerHTML = stats.map(s => {
    const onPlan      = s.avg >= CONFIG.target_m3;
    const avgClass    = onPlan ? 'good' : 'bad';
    const streakClass = s.streak >= 5 ? 'gold' : (s.streak >= 3 ? 'good' : '');
    const medalHtml   = s.rank === 1 ? '<span class="card-medal">🥇</span>' : '';
    const gapRow = s.rank > 1
      ? `<div class="stat-row"><span>Trūksta iki ${s.rank - 1} v.</span><span class="stat-val bad">−${s.gapToNext.toFixed(2)} m³</span></div>`
      : '';
    const wasteT = (s.waste / 1000).toLocaleString('lt-LT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return `
      <div class="rank-card" data-rank="${s.rank}" data-onplan="${onPlan}">
        <div class="card-top">
          <span class="rank-badge" data-rank="${s.rank}">${s.rank} vieta</span>
          ${medalHtml}
        </div>
        <p class="card-name">${s.name}</p>
        <p class="card-total" data-rank="${s.rank}">${s.tot.toLocaleString('lt-LT')}</p>
        <p class="card-unit">m³ šiuo laikotarpiu</p>
        <div class="stat-row">
          <span>Darbo dienos</span>
          <span class="stat-val">${s.days} d.</span>
        </div>
        <div class="stat-row">
          <span>Vid. / pamainai <span style="display:inline-block;font-size:11px;font-weight:800;background:${s.avgRank===1?'#C47A00':s.avgRank===2?'#888':s.avgRank===3?'#a05c00':'#bbb'};color:#fff;border-radius:4px;padding:1px 5px;vertical-align:middle;margin-left:3px">${s.avgRank}v</span></span>
          <span class="stat-val ${avgClass}">${s.avg} m³</span>
        </div>
        <div class="stat-row">
          <span>Atliekos</span>
          <span class="stat-val">${wasteT} t</span>
        </div>
        <div class="stat-row">
          <span>Žaliava</span>
          <span class="stat-val">${(s.rawKg/1000).toLocaleString('lt-LT',{minimumFractionDigits:2,maximumFractionDigits:2})} t</span>
        </div>
        ${gapRow}
      </div>`;
  }).join('');
}

function renderShiftBarsChart(periodData, canvasId, legendId, showFuture) {
  const now = new Date();
  const sorted = [...periodData].sort((a, b) =>
    a.date.localeCompare(b.date) || a.shift - b.shift
  );

  const labels = [], values = [], bgColors = [], bdColors = [];

  sorted.forEach(e => {
    const dt = new Date(e.date + 'T12:00:00');
    const dd = String(dt.getDate()).padStart(2, '0');
    const mm = String(dt.getMonth() + 1).padStart(2, '0');
    labels.push([dd + '.' + mm, 'P' + e.shift + (e.type ? ' ' + e.type : '')]);
    values.push(e.m3);
    bgColors.push(SHIFT_COLORS[e.shift - 1].bg);
    bdColors.push(SHIFT_COLORS[e.shift - 1].border);
  });

  if (showFuture) {
    const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    for (let d = now.getDate() + 1; d <= daysInMonth; d++) {
      const dd = String(d).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      for (let s = 0; s < CONFIG.shifts_per_day; s++) {
        labels.push([dd + '.' + mm, s === 0 ? 'D' : 'N']);
        values.push(null);
        bgColors.push('transparent');
        bdColors.push('transparent');
      }
    }
  }

  document.getElementById(legendId).innerHTML =
    [1, 2, 3, 4].map((s, i) =>
      `<span><span class="legend-dot" style="background:${SHIFT_COLORS[i].bg}"></span>${s} pam.</span>`
    ).join('') +
    `<span style="margin-left:6px;padding-left:8px;border-left:1px solid #e5e5ea;display:flex;align-items:center;gap:4px">` +
    `<span style="width:18px;border-top:2px dashed #E24B4A;display:inline-block"></span>Tikslas</span>`;

  const _cv = document.getElementById(canvasId);
  const _ex = Chart.getChart(_cv); if (_ex) _ex.destroy();
  new Chart(_cv, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          data: values,
          backgroundColor: bgColors,
          borderColor: bdColors,
          borderWidth: 1,
          borderRadius: 3,
        },
        {
          data: Array(labels.length).fill(CONFIG.target_m3),
          type: 'line',
          borderColor: '#E24B4A',
          borderDash: [6, 3],
          borderWidth: 3,
          pointRadius: 0,
          fill: false,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: {
          ticks: {
            font: { size: 9, family: "'Montserrat', sans-serif" },
            autoSkip: false,
            maxRotation: 90,
            minRotation: 90,
          },
          grid: { display: false },
        },
        y: {
          min: 0,
          suggestedMax: 150,
          ticks: { font: { size: 11, family: "'Montserrat', sans-serif" } },
          grid: { color: 'rgba(0,0,0,0.04)' },
        }
      }
    }
  });
}

function renderYearlyChart(data, canvasId, legendId) {
  const months = [...new Set(data.map(d => d.date.substring(0, 7)))].sort();
  const labels  = months.map(m => MONTH_SHORT[parseInt(m.split('-')[1]) - 1]);

  // Kiekvienam mėnesiui — pamainos surūšiuotos pagal m³ didėjančiai (mažiausia apačioje)
  const monthSorted = months.map(month =>
    [1, 2, 3, 4]
      .map(s => ({
        shift: s,
        m3: +data.filter(d => d.shift === s && d.date.startsWith(month))
                 .reduce((a, b) => a + b.m3, 0).toFixed(1),
      }))
      .sort((a, b) => a.m3 - b.m3)   // mažiausia [0], didžiausia [3]
  );

  // 4 "rango" datasets — kiekvienas = viena pozicija stulpelyje (apačia→viršus)
  const datasets = [0, 1, 2, 3].map(rank => ({
    label: 'rank' + rank,
    data:            monthSorted.map(s => s[rank]?.m3 || 0),

    borderColor:     monthSorted.map(s => SHIFT_COLORS[(s[rank]?.shift || 1) - 1].border),

    ).join('');

  const _yc = document.getElementById(canvasId);
  const _yex = Chart.getChart(_yc); if (_yex) _yex.destroy();
  new Chart(_yc, {

      plugins: {
        legend: { display: false },

          callbacks: {
            label: ctx => {

/* ── Rekordai (per visą laikotarpį) ── */
function computeRecords(data) {
  // Sujungti pagal data+pamaina (per visus tipus)
  const byShiftDay = {};
  data.forEach(d => {
    const key = d.date + '|' + d.shift;
    if (!byShiftDay[key]) byShiftDay[key] = { date: d.date, shift: d.shift, m3: 0, gas: 0 };
    byShiftDay[key].m3  += d.m3;
    byShiftDay[key].gas += d.gas;
  });
  const arr = Object.values(byShiftDay);

  // Daugiausiai m³ — VIENAS PEČIUS, viena pamaina (iš nesusumuotų eilučių)
  const rawArr = window.RAW_SHIFT_DATA || arr;
  let maxRec = null;
  rawArr.forEach(r => { if (r.m3 > 0 && (!maxRec || r.m3 > maxRec.m3)) maxRec = r; });

  // Ekonomiškiausia: didžiausias m³/dujos (tik pilnesnės pamainos, gas>0)
  let ecoRec = null;
  arr.forEach(r => {
    if (r.gas > 0 && r.m3 >= 60) {
      const eff = +(r.m3 / r.gas * 100).toFixed(1);
      if (!ecoRec || eff > ecoRec.eff) ecoRec = { ...r, eff };
    }
  });

  // Kiekvienos pamainos rekordas atskirai
  const shiftBest = {};
  arr.forEach(r => {
    if (!shiftBest[r.shift] || r.m3 > shiftBest[r.shift].m3) shiftBest[r.shift] = r;
  });

  return { maxRec, ecoRec, shiftBest };
}

function renderRecords(data) {
  const { maxRec, ecoRec, shiftBest } = computeRecords(data);
  const fmtDate = ds => {
    const p = String(ds).split('-');
    return (+p[2]) + ' ' + (MONTH_SHORT[(+p[1]) - 1] || '') + ' ' + escapeHtml(p[0]);
  };
  const shiftBadge = s => {
    const c = SHIFT_COLORS[s - 1] || SHIFT_COLORS[0];
    return `<span class="record-shift-badge" style="background:${c.border}">${s} pamaina</span>`;
  };

  let html = '';
  if (maxRec) {
    html += `<div class="record-card rec-max">
      <div class="record-icon">🏆</div>
      <div class="record-body">
        <div class="record-label">Daugiausiai per pamainą · 1 pečius</div>
        <div class="record-value">${maxRec.m3.toLocaleString('lt-LT')} m³</div>
        <div class="record-meta">${shiftBadge(maxRec.shift)} · ${fmtDate(maxRec.date)}</div>
      </div>
    </div>`;
  }
  document.getElementById('records-banner').innerHTML = html;
  document.getElementById('shift-records-banner').innerHTML = '';
}

let PROD_DATA = [];
let selYear, selMonth;

function renderMonthlySummary(monthlyData, monthLabel) {
  const el = document.getElementById('monthly-summary-card');
  if (!el) return;
  if (!monthlyData.length) { el.innerHTML = ''; return; }

  const totalM3 = monthlyData.reduce((s, d) => s + d.m3, 0);
  const prdTotals = {};
  monthlyData.forEach(d => {
    if (d.prd) Object.keys(d.prd).forEach(k => { prdTotals[k] = (prdTotals[k] || 0) + d.prd[k]; });
  });

  const capitalize = s => s.charAt(0).toUpperCase() + s.slice(1);

  const prdRows = Object.entries(prdTotals)
    .filter(([, v]) => v > 0)
    .map(([k, val]) => `<tr>
      <td style="padding:2px 0">${capitalize(k)}</td>
      <td style="text-align:right;font-weight:700;padding:2px 0 2px 12px">${val.toLocaleString('lt-LT')} m³</td>
    </tr>`).join('');

  const totalRaw = monthlyData.reduce((s, d) => s + (d.raw || 0), 0);

  el.innerHTML = `<div class="record-card" style="display:flex;flex-direction:column;gap:8px;align-self:stretch">
    <div style="font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
      📦 Mėnesio gamyba · ${monthLabel} — ${totalM3.toLocaleString('lt-LT')} m³
    </div>
    ${prdRows ? `<table style="width:100%;border-collapse:collapse;font-size:20px;line-height:1.7">${prdRows}</table>` : ''}
    ${totalRaw > 0 ? `<div style="font-size:18px;font-weight:700;color:#444;margin-top:4px;border-top:1px solid #eee;padding-top:6px">
      🪨 Žaliava: ${totalRaw.toLocaleString('lt-LT')} kg
    </div>` : ''}
  </div>`;
}

function renderMonthlyView() {
  const now = new Date();
  const isCurrent = (selYear === now.getFullYear() && selMonth === now.getMonth());
  const monthStart = toDateStr(new Date(selYear, selMonth, 1));
  const lastDay    = new Date(selYear, selMonth + 1, 0);
  const monthEnd   = isCurrent ? toDateStr(now) : toDateStr(lastDay);

  const monthlyData  = filterRange(PROD_DATA, monthStart, monthEnd);
  const monthlyStats = buildStats(monthlyData, PROD_DATA);

  document.getElementById('m-month-sel').value = selMonth;
  document.getElementById('m-year-sel').value  = selYear;
  renderCards(monthlyStats, 'monthly-cards');
  renderShiftBarsChart(monthlyData, 'monthly-chart', 'monthly-legend', isCurrent);
  const monthLabel = MONTH_NAMES[selMonth] + ' ' + selYear;
  renderMonthlySummary(monthlyData, monthLabel);
}

function navMonth(dir) {
  selMonth += dir;
  if (selMonth < 0)  { selMonth = 11; selYear--; }
  if (selMonth > 11) { selMonth = 0;  selYear++; }
  const ySel = document.getElementById('m-year-sel');
  if (![...ySel.options].some(o => parseInt(o.value) === selYear)) {
    const opt = document.createElement('option'); opt.value = selYear; opt.textContent = selYear; ySel.appendChild(opt);
    [...ySel.options].sort((a,b)=>b.value-a.value).forEach(o=>ySel.appendChild(o));
  }
  renderMonthlyView();
}

function onMonthSel() {
  selMonth = parseInt(document.getElementById('m-month-sel').value);
  selYear  = parseInt(document.getElementById('m-year-sel').value);
  renderMonthlyView();
}

function init(data) {
  const now      = new Date();
  const todayStr = toDateStr(now);
  PROD_DATA = data;

  renderRecords(data);
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();

  document.getElementById('month-display').textContent = now.getDate() + ' / ' + daysInMonth;
  document.getElementById('day-display').textContent   = MONTH_NAMES[now.getMonth()] + ' ' + now.getFullYear();

  // Mėnesinis vaizdas — su mėnesio pasirinkimu
  const years = [...new Set(data.map(d => (d.date || '').substring(0, 4)).filter(y => /^\d{4}$/.test(y)))].map(Number);
  const minY = Math.min(...years, now.getFullYear());
  const maxY = Math.max(...years, now.getFullYear());
  const ySel = document.getElementById('m-year-sel');
  ySel.innerHTML = '';
  for (let y = maxY; y >= minY; y--) { const o = document.createElement('option'); o.value = y; o.textContent = y; ySel.appendChild(o); }
  // Rodyti paskutinį mėnesį su duomenimis (ne dabartinį, jei duomenų dar nėra)
  const lastDate = data.map(d => d.date).filter(Boolean).sort().pop() || '';
  if (lastDate && lastDate < toDateStr(new Date(now.getFullYear(), now.getMonth(), 1))) {
    selYear  = parseInt(lastDate.substring(0, 4));
    selMonth = parseInt(lastDate.substring(5, 7)) - 1;
  } else {
    selYear = now.getFullYear(); selMonth = now.getMonth();
  }
  renderMonthlyView();

  // Metinis vaizdas
  const yearStart   = toDateStr(new Date(now.getFullYear(), 0, 1));
  const yearlyData  = filterRange(data, yearStart, todayStr);
  const yearlyStats = buildStats(yearlyData, data);
  document.getElementById('yearly-title').textContent =
    now.getFullYear() + ' m. — metinis vaizdas';
  renderCards(yearlyStats, 'yearly-cards');
  renderYearlyChart(yearlyData, 'yearly-chart', 'yearly-legend');

  document.getElementById('status-bar').textContent =
    'Atnaujinta: ' + now.toLocaleString('lt-LT', { dateStyle: 'short', timeStyle: 'short' }) +
    ' · Puslapis atsinaujina kas 5 min.';
}

async function loadAndRender() {
  document.getElementById('loading-overlay').classList.add('visible');
  try {
    const resp = await fetch(CSV_URL + '&t=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = await resp.text();
    const rows = parseCSV(text).filter(r => r.some(c => c.trim() !== ''));
    // Normalizuoti header'iai: ž→z, "0-1 mm"→"0-1mm" (pašalina dublikatus ir LT simbolių neatitikimus)
    const normalizeH = h => h.trim().toLowerCase()
      .replace(/ž/g, 'z').replace(/š/g, 's').replace(/č/g, 'c').replace(/ė/g, 'e').replace(/ų/g, 'u').replace(/ū/g, 'u').replace(/į/g, 'i').replace(/ą/g, 'a')
      .replace(/0-1\s+mm/g, '0-1mm');
    const headers = rows[0].map(normalizeH);

    // Auto-detektavimas pagal pavadinimų šabloną — nauji stulpeliai veikia automatiškai
    const M3_COLS    = [
      ...new Set([
        ...headers.filter(h => /^produktas .+ m3$/.test(h)),
        // seni stulpelių pavadinimai (suderinamumas):
        'premium m3','medium m3','extra m3','a silos m3','b silos m3','c silos m3',
      ])
    ];
    const BB_COLS    = [
      ...new Set([
        ...headers.filter(h => /^produktas .+ bb$/.test(h)),
        'd bb','d bb kg',
      ])
    ];
    const WASTE_COLS = ['krituliai','krit','fines','e bb','e bb kg','e maisai'];
    const RAW_COLS   = [...new Set(headers.filter(h => /zaliava kg$/.test(h)))];

    // Unikalūs produktų pavadinimai iš stulpelių (dinamiškai), be "tankis"
    const PRODUCT_NAMES = [...new Set(
      headers
        .filter(h => /^produktas .+ m3$/.test(h))
        .map(h => h.replace(/^produktas /, '').replace(/ m3$/, '').trim())
    )];

    const n = v => parseFloat(String(v || '').replace(',', '.')) || 0;

    const data = rows.slice(1)
      .map(vals => {
        const o = {};
        headers.forEach((h, i) => { o[h] = (vals[i] || '').trim(); });

        const m3sum = M3_COLS.reduce((s, k) => s + n(o[k]), 0);
        const m3    = m3sum > 0 ? m3sum : n(o.m3);
        const waste = WASTE_COLS.reduce((s, k) => s + n(o[k]), 0);
        const bb    = BB_COLS.reduce((s, k) => s + n(o[k]), 0);
        const raw   = RAW_COLS.reduce((s, k) => s + n(o[k]), 0) || n(o.raw);

        // Dinamiškas m3 per produktą
        const prd = {};
        PRODUCT_NAMES.forEach(name => {
          const val = n(o[`produktas ${name} m3`]) || n(o[`${name} m3`]);
          if (val) prd[name] = val;
        });

        // Dinamiškas kg per žaliavą
        const rawBrk = {};
        RAW_COLS.forEach(col => {
          const val = n(o[col]);
          if (val) rawBrk[col.replace(/ zaliava kg$/, '').trim()] = val;
        });

        return {
          date:  o.date  || '',
          shift: parseInt(o['pamaina'] || o['shift']) || 0,
          type:  o['pamaina tip'] || o['type'] || '',
          furn:  o.furn  || '',
          m3,
          bb,
          waste,
          gas:   n(o['dujos m3'] || o.gas),
          kwh:   n(o['elektra kwh'] || o.kwh),
          raw,
          prd,
          rawBrk,
          komentaras: o['komentarai pildytojui'] || '',
        };
      })
      .filter(d => d.date && d.shift > 0);

    // Jei ta pati data+pamaina+tipas turi kelis įrašus (skirtingi Furn) — susumuoti
    const grouped = {};
    data.forEach(d => {
      const key = d.date + '|' + d.shift + '|' + d.type;
      if (!grouped[key]) {
        grouped[key] = { ...d };
      } else {
        grouped[key].m3    += d.m3;
        grouped[key].bb    += d.bb;
        grouped[key].waste += d.waste;
        grouped[key].gas   += d.gas;
        grouped[key].kwh   += d.kwh;
        grouped[key].raw   += d.raw;
        Object.keys(d.prd).forEach(k => { grouped[key].prd[k] = (grouped[key].prd[k] || 0) + d.prd[k]; });
        Object.keys(d.rawBrk).forEach(k => { grouped[key].rawBrk[k] = (grouped[key].rawBrk[k] || 0) + d.rawBrk[k]; });
      }
    });
    const mergedData = Object.values(grouped);

    // Saugom nesusumuotus duomenis — vienas įrašas = vienas pečius, viena pamaina
    window.RAW_SHIFT_DATA = data;

    init(mergedData);
  } catch (e) {
    const bar = document.getElementById('status-bar');
    bar.textContent = 'Klaida kraunant duomenis iš Google Sheets. Puslapis bandys atsinaujinti po 5 min.';
    bar.classList.add('error');
  }
  document.getElementById('loading-overlay').classList.remove('visible');
}

      empty.style.display = 'none';

    } else {
      txt.style.display = 'none';
      empty.style.display = 'block';
      clr.style.display = 'none';
      lbl.classList.remove('red');
    }
  }

  window.pranesEdit = function() {

    inp.value = msg;

    inp.select();

    e.stopPropagation();
    localStorage.removeItem(KEY);
    pranesRender();
  };

    if (e.key === 'Enter') { inp.blur(); }
    if (e.key === 'Escape') { pranesRender(); }

    else localStorage.removeItem(KEY);

  });

  inp.addEventListener('click', e => e.stopPropagation());

})();

/* ── ŠIANDIEN KROVINIAI ── */
(function() {
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbz3O2FzFkxgoEOmNKvBxtKpVr6lVAX-VAPzvZSkJb4NL_dCUtGqqFYwSFPFeeeqY6Nk/exec';
  const block    = document.getElementById('today-krov-block');
  const rowsEl   = document.getElementById('today-krov-rows');
  const dateEl   = document.getElementById('today-krov-date');

  const today = new Date().toISOString().slice(0, 10);
  const lt = ['Sausis','Vasaris','Kovas','Balandis','Gegužė','Birželis','Liepa','Rugpjūtis','Rugsėjis','Spalis','Lapkritis','Gruodis'];
  const d = new Date();
  dateEl.textContent = d.getDate() + ' ' + lt[d.getMonth()] + ' ' + d.getFullYear();

  function parseSimpleCSV(text) {
    const rows = [];
    for (const line of text.split('\n')) {
      const cells = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
        else if (c === ',' && !inQ) { cells.push(cur); cur = ''; }
        else cur += c;
      }
      cells.push(cur);
      rows.push(cells);
    }
    return rows;
  }

  const token = localStorage.getItem('po_secret');
  if (!token) return;

  const CACHE_KEY = 'krov_cache_' + today;

  function renderOrders(orders) {
    if (!orders.length) return;
    block.style.display = 'block';
    rowsEl.innerHTML = orders.map(o => `
      <div style="display:flex;align-items:baseline;gap:1rem;padding:0.4rem 0;border-top:1px solid #f0f0f0;flex-wrap:wrap">
        <span style="font-size:25px;font-weight:900;color:#111;min-width:100px">${o.produktas || '—'}</span>
        <span style="font-size:19px;font-weight:700;color:#111">${o.auto_info || '—'}</span>
        <span style="font-size:19px;font-weight:600;color:#111">${o.uzsakovas || '—'}</span>
      </div>`).join('');
  }

  // Rodyti kešą akimirksniu
  try {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) renderOrders(JSON.parse(cached));
  } catch (_) {}

  // Fone pakrauti šviežius duomenis
  fetch(ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ mode: 'read', token })
  })
  .then(r => r.json())
  .then(out => {
    if (!out.ok || !out.csv) return;
    const rows = parseSimpleCSV(out.csv);
    const orders = rows
      .slice(1)
      .filter(v => /^\d+$/.test((v[0]||'').trim()) && (v[5]||'').trim() && (v[2]||'').trim() === today)
      .map(v => ({
        produktas:   (v[4] || '').trim(),
        uzsakovas:   (v[5] || '').trim(),
        auto_info:   (v[9] || '').trim(),
      }));
    // Išvalyti senus kešus (kitos dienos)
    Object.keys(localStorage).filter(k => k.startsWith('krov_cache_') && k !== CACHE_KEY).forEach(k => localStorage.removeItem(k));
    localStorage.setItem(CACHE_KEY, JSON.stringify(orders));
    renderOrders(orders);
  })
  .catch(() => {});
})();

function openTokenDlg() {
  const dlg = document.getElementById('token-dlg');
  dlg.style.display = 'flex';
  const inp = document.getElementById('token-input');
  inp.value = localStorage.getItem('po_secret') || '';
  document.getElementById('token-status').textContent = inp.value ? '✓ Kodas jau išsaugotas' : '';
  setTimeout(() => inp.focus(), 50);
}
function closeTokenDlg() {
  document.getElementById('token-dlg').style.display = 'none';
}
function saveToken() {
  const v = document.getElementById('token-input').value.trim();
  if (!v) return;
  localStorage.setItem('po_secret', v);
  document.getElementById('token-status').textContent = '✓ Išsaugota — puslapis atsinaujins';
  setTimeout(() => { closeTokenDlg(); location.reload(); }, 1200);
}
document.getElementById('token-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveToken();
  if (e.key === 'Escape') closeTokenDlg();
});
</script>
</body>
</html>
